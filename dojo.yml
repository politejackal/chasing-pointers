id: chasing-pointers
name: Chasing Pointers
image: pwncollege/challenge-legacy:latest
description: |
  Welcome to the cool part of pwn.college. We know pointers are a pain in the butt. Everyone gets lost in them at some point: so we made something special for ya.

  No exploits, no shellcode. Just you, a C program, and a pointer. Follow it, figure out where it lands, and tell us what the program prints.

  Starts easy. Doesn't stay that way. ;)
award:
  emoji: 🧶

modules:
  - id: chasing-pointers
    name: Warmup
    description: |
      Each challenge gives you a C program at `/challenge/prog.c`. Read it, figure out what it prints, then run `/challenge/run` and type the output.

      - If it prints an address, answer with `&` and the variable's name, like `&treat`.
      - If it prints a random garbage value, answer `garbage`.
      - Press Ctrl+C to skip the animation.
    challenges:
      - id: warm-up
        name: Warm-up
