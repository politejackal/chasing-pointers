id: chasing-pointers
name: Chasing Pointers
image: pwncollege/challenge-legacy:latest
description: |
  Welcome to the cool side of pwn.college. We know pointers are a pain in the butt. Everyone gets lost in them at some point: so we made something special for ya.

  No exploits, no shellcode. Just you, a C program, and a pointer. Follow it, figure out where it lands, and tell us what the program prints.

  Starts easy. Doesn't stay that way. :)
award:
  emoji: 🧶

modules:
  - id: warm-up
    name: Warm Up
    description: |
      Each challenge gives you a C program at `/challenge/prog.c`. Read it, figure out what it prints, then run `/challenge/run` and type your answer.

      - If it prints an address, answer with `&` and the variable's name, like `&treat`.
      - If it prints a random garbage value, like from an uninitialized variable, just answer `garbage`.
      - Press Ctrl+C to skip the animation (I don't recommend doing it though) :)
    challenges:
      - id: are-you-ready
        name: Are you ready?
        description: "Let's see whatchu got."
      - id: lets-see
        name: Let's see
        description: "Hmmm, the previous one was intentionally cheesable... Let's see what you really got."
      - id: hmmmmm
        name: Hmmmmm...
        description: "Joke's on you. This is just the warm-up, don't think you are good yet :)"
