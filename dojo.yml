id: chasing-pointers
name: Chasing Pointers
image: pwncollege/challenge-legacy:latest

award:
  emoji: 🧶

modules:
  - id: chasing-pointers
    name: Warmup
    description: |
      Each challenge gives you a C program at `/challenge/prog.c`. Read it, figure out what it prints, then run `/challenge/run` and type the output.

      - If it prints an address, answer with `&` and the variable's name, like `&treat`.
      - If it prints a random garbage value, like from an uninitialized variable, answer `garbage`.
      - Press Ctrl+C to skip the animation.
    challenges:
      - id: warm-up
        name: Warm-up
